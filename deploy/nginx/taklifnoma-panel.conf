# Boshqaruv paneli (boshqaruv.<domen>) — HTTP va HTTPS bloklari ichidan chaqiriladi.
root /opt/taklifnoma/current/sites/boshqaruv;
index index.html;
charset utf-8;
server_tokens off;
client_max_body_size 16k;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Robots-Tag "noindex, nofollow" always;

# Panel API: rasm yuklash uchun katta so'rovlar, GitHub'ga yozish uchun uzoqroq kutish
location /api/panel/ {
    client_max_body_size 40m;
    proxy_pass http://127.0.0.1:3190;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Wedding-Slug boshqaruv;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
}

location /api/ {
    return 404;
}

location /assets/ {
    expires max;
    try_files $uri =404;
}

location / {
    expires epoch;
    try_files $uri $uri.html $uri/ =404;
}
