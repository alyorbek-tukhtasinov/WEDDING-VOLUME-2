    <style>
      /* Skript yuklanguncha ham chiroyli fon (oq chaqnash bo'lmasin) */
      html, body { background: #050102; margin: 0; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, #0d0408, #030001); color: #c9a96e; font: 28px serif; }
      .boot i { font-style: normal; animation: boot 1.2s ease-in-out infinite; }
      .boot i::before { content: '♥'; }
      @keyframes boot { 50% { transform: scale(1.25); opacity: .6; } }
    </style>
