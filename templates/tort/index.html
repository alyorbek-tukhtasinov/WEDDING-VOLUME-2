    <style>
      /* Skript yuklanguncha ham chiroyli fon (oq chaqnash bo'lmasin) */
      html, body { background: #0b0614; margin: 0; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(60% 45% at 50% 55%, #2a1630, #0b0614 75%); }
      .boot i { width: 8px; height: 22px; border-radius: 50% 50% 45% 45%; background: linear-gradient(#fff6c8, #ffb347 60%, #ff6a3d); box-shadow: 0 0 24px 8px rgba(255, 170, 70, .35); animation: boot 1.1s ease-in-out infinite alternate; transform-origin: 50% 100%; }
      @keyframes boot { to { transform: scale(.85, 1.12) skewX(-4deg); opacity: .8; } }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot" aria-label="Sayt ochilmoqda"><i></i></div></div>
