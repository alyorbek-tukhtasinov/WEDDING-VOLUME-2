# Taklifnoma saytlari (HTTPS). Sertifikat birinchi marta olingandan keyingina yoqiladi.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "~^(?!www\.)(?<slug>[a-z0-9][a-z0-9-]*)\.__DOMAIN_RE__$";

    ssl_certificate /etc/letsencrypt/live/taklifnoma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taklifnoma/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/taklifnoma-site.conf;
}
