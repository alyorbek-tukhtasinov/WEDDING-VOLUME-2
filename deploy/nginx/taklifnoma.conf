# Taklifnoma saytlari (HTTP): <nom>.__DOMAIN__ → /opt/taklifnoma/current/sites/<nom>
# Serverdagi boshqa saytlarga (botlar) ta'sir qilmaydi: nginx'da aniq yozilgan server_name
# har doim bu umumiy qoidadan ustun turadi.
# HTTPS sertifikati olingan manzillar (taklifnoma-https.map) https:// ga yo'naltiriladi.
map $host $taklifnoma_https {
    default 0;
    include /etc/nginx/taklifnoma-https.map;
}

map "$taklifnoma_https:$request_uri" $taklifnoma_redirect {
    default 0;
    "~^1:/(?!\.well-known/acme-challenge/)" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name "~^(?!www\.)(?<slug>[a-z0-9][a-z0-9-]*)\.__DOMAIN_RE__$";

    if ($taklifnoma_redirect) {
        return 301 https://$host$request_uri;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    include /etc/nginx/snippets/taklifnoma-site.conf;
}

# Boshqaruv paneli — aniq nom umumiy qoidadan ustun
server {
    listen 80;
    listen [::]:80;
    server_name boshqaruv.__DOMAIN__;

    if ($taklifnoma_redirect) {
        return 301 https://$host$request_uri;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    include /etc/nginx/snippets/taklifnoma-panel.conf;
}
