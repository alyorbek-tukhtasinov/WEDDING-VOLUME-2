# Har bir taklifnoma sayti uchun umumiy qoidalar (HTTP va HTTPS bloklari ichidan chaqiriladi).
root /opt/taklifnoma/current/sites/$slug;
index index.html;
charset utf-8;
client_max_body_size 16k;
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Mehmon javoblari, tilaklar, admin — server/index.js (faqat 127.0.0.1)
location /api/ {
    proxy_pass http://127.0.0.1:3190;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Wedding-Slug $slug;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}

# Nomi xeshli fayllar — hech qachon o'zgarmaydi
location /assets/ {
    expires max;
    try_files $uri =404;
}

location /images/ {
    expires 7d;
    try_files $uri =404;
}

location /media/ {
    expires 7d;
    try_files $uri =404;
}

location /music/ {
    expires 7d;
    try_files $uri =404;
}

location = /admin {
    expires epoch;
    try_files /admin.html =404;
}

# HTML har safar tekshiriladi — yangilanish mehmonlarga darhol yetib boradi
location / {
    expires epoch;
    try_files $uri $uri.html $uri/ =404;
}
